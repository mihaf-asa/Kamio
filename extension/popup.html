<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KinoSync Extension</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.4;
      }
      .wrap {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .brand {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      .status-line {
        font-size: 11px;
        color: #a1a1aa;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #52525b;
      }
      .dot.ok {
        background: #10b981;
      }
      .dot.warn {
        background: #f59e0b;
      }
      .dot.err {
        background: #ef4444;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #a1a1aa;
        margin-bottom: 5px;
      }
      input[type="text"] {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #111115;
        color: #ffffff;
        font-size: 13px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #f59e0b;
      }
      .colors {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch.active {
        border-color: #ffffff;
        transform: scale(1.1);
      }
      .btn-primary {
        width: 100%;
        height: 38px;
        border: none;
        border-radius: 8px;
        background: #f59e0b;
        color: #09090b;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn-primary:hover {
        background: #fbbf24;
      }
      .btn-secondary {
        width: 100%;
        height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #111115;
        color: #e4e4e7;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .btn-secondary:hover {
        background: #18181d;
      }
      .btn-danger {
        width: 100%;
        height: 34px;
        border: 1px solid rgba(239, 68, 68, 0.35);
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .info-box {
        padding: 10px 12px;
        border-radius: 8px;
        background: #111115;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: #d4d4d8;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .muted {
        font-size: 11px;
        color: #71717a;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .error {
        font-size: 11px;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">KinoSync</div>
        <div class="status-line">
          <span id="status-dot" class="dot"></span>
          <span id="status-label">Idle</span>
        </div>
      </div>

      <div>
        <label for="display-name">Display Name</label>
        <input id="display-name" type="text" maxlength="28" placeholder="Your name" />
        <div class="colors" id="color-swatches" aria-label="Chat bubble accent color"></div>
      </div>

      <div>
        <label for="room-id">Room ID or Invite URL</label>
        <input id="room-id" type="text" placeholder="e.g. k9x-4m2 or ?room=k9x-4m2" />
      </div>

      <div id="error-msg" class="error" style="display: none"></div>

      <button id="connect-btn" class="btn-primary" type="button">Connect to Room</button>

      <div id="active-panel" style="display: none; flex-direction: column; gap: 8px">
        <div class="info-box">
          <div id="video-info">Scanning page for &lt;video&gt;...</div>
          <div id="peer-info" class="muted">Waiting for room state...</div>
        </div>
        <div class="row">
          <button id="sync-btn" class="btn-secondary" type="button">Force Sync</button>
          <button id="chat-btn" class="btn-secondary" type="button">Mini-Chat (Alt+C)</button>
        </div>
        <button id="disconnect-btn" class="btn-danger" type="button">Disconnect</button>
      </div>

      <div class="muted">
        Open any movie tab, connect with the Room ID from your lobby, and press <strong>Alt + C</strong>
        in fullscreen to chat.
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
